
<!DOCTYPE html>
<html>
<head>
<title>Student QR Generation</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body {
 font-family: Arial;
 background: #eaf0ff;
 text-align: center;
 padding: 20px;
}
.container {
 background: white;
 padding: 25px;
 margin: 30px auto;
 max-width: 350px;
 border-radius: 15px;
}
input, button {
 width: 90%;
 padding: 12px;
 margin: 10px;
 border-radius: 7px;
 border: 1px solid #ccc;
}
button {
 background: #304ffe;
 color: white;
 border: none;
}
#qrcode {
 display: flex;
 justify-content: center;
 margin: 20px;
}
</style>
</head>
<body>
<div class="container">
<h2>Smart Attendance System</h2>
<h3>Generate Student QR Code</h3>

<input id="name" placeholder="Student Name">
<input id="reg" placeholder="Register Number">

<button onclick="generateQR()">Generate QR Code</button>

<div id="qrcode"></div>
<p id="result"></p>
</div>

<script>
function generateQR() {
 let name = document.getElementById("name").value;
 let reg = document.getElementById("reg").value;

 if(name === "" || reg === "") {
 alert("Enter student details");
 return;
 }

 document.getElementById("qrcode").innerHTML = "";

 new QRCode(document.getElementById("qrcode"), {
 text: JSON.stringify({
 name: name,
 registerNumber: reg
 }),
 width: 200,
 height: 200
 });

 document.getElementById("result").innerHTML =
 "QR Code Generated Successfully!";
}
</script>
</body>
</html>
