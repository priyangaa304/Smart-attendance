
<!DOCTYPE html>
<html>
<head>
<title>Smart Attendance System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  font-family: Arial;
  background: #eaf0ff;
  text-align: center;
  padding: 30px;
}
.container {
  background: white;
  padding: 25px;
  border-radius: 15px;
  max-width: 350px;
  margin: 50px auto;
}
input, button {
  width: 90%;
  padding: 12px;
  margin: 10px;
  border-radius: 8px;
}
button {
  background: #315bea;
  color: white;
  border: none;
}
</style>
</head>
<body>

<div class="container">
<h2>Smart Attendance System</h2>
<h3>Teacher Login</h3>

<input type="text" id="username" placeholder="Teacher Name">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

<p id="message"></p>
</div>

<script>
function login() {
 let user = document.getElementById("username").value;
 let pass = document.getElementById("password").value;

 if(user === "teacher" && pass === "1234") {
   document.getElementById("message").innerHTML =
   "Login Successful!";
 } else {
   document.getElementById("message").innerHTML =
   "Invalid Username or Password";
 }
}
</script>

</body>
</html>
