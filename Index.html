
<!DOCTYPE html>
<html>
<head>
<title>Smart Attendance System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  font-family: Arial;
  background: #eaf0ff;
  text-align: center;
  padding: 30px;
}
.container {
  background: white;
  padding: 25px;
  margin: 50px auto;
  max-width: 350px;
  border-radius: 15px;
  box-shadow: 0 3px 12px #aaa;
}
input, button {
  width: 90%;
  padding: 12px;
  margin: 10px;
  border-radius: 7px;
  border: 1px solid #ccc;
}
button {
  background: #304ffe;
  color: white;
  border: none;
}
h2 { color: #304ffe; }
</style>
</head>
<body>
<div class="container">
<h2>Smart Attendance System</h2>
<h3>Teacher Login</h3>
<input type="text" placeholder="Teacher Username">
<input type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="message"></p>
</div>
<script>
function login() {
 document.getElementById("message").innerHTML =
 "Welcome Teacher!";
}
</script>
</body>
</html>
