
<!DOCTYPE html>
<html>
<head>
<title>Student Registration</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  font-family: Arial;
  background: #eaf0ff;
  text-align: center;
  padding: 20px;
}
.container {
  background: white;
  padding: 25px;
  margin: 30px auto;
  max-width: 350px;
  border-radius: 15px;
}
input, select, button {
  width: 90%;
  padding: 12px;
  margin: 10px;
  border: 1px solid #ccc;
  border-radius: 7px;
}
button {
  background: #304ffe;
  color: white;
  border: none;
}
</style>
</head>
<body>
<div class="container">
<h2>Student Registration</h2>

<input id="name" placeholder="Student Name">
<input id="reg" placeholder="Register Number">

<select id="dept">
<option value="">Select Department</option>
<option>MCA</option>
<option>MBA</option>
<option>M.Sc</option>
<option>BCA</option>
</select>

<input id="year" placeholder="Year">

<button onclick="register()">Register</button>
<p id="msg"></p>
</div>

<script>
function register() {
let name = document.getElementById("name").value;
let reg = document.getElementById("reg").value;
let dept = document.getElementById("dept").value;

if(name && reg && dept) {
document.getElementById("msg").innerHTML =
"Registration Successful!";
} else {
document.getElementById("msg").innerHTML =
"Please fill all details!";
}
}
</script>
</body>
</html>
